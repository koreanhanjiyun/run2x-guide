# 한 번만 쓰는 정리: 대시보드 스키드패드 목표 기록을 좌우 한 바퀴 합으로 (tools/migrate/skid_sum.js)
# Actions 탭 → "스키드패드 목표 좌우 합으로" → Run workflow → mode = dry(확인만) 또는 apply(바꿈)
name: 스키드패드 목표 좌우 합으로
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry = 대상만 확인 / apply = 바꿈'
        default: 'dry'
        required: true
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 서비스 계정 키 준비
        run: printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
      - name: 실행
        run: cd tools/migrate && npm i --no-save firebase-admin@12 >/dev/null && node skid_sum.js "${{ github.event.inputs.mode }}"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
