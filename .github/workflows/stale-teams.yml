# 매달 1일, 2년 동안 팀원이 아무도 접속하지 않은 팀을 자동 삭제합니다 (삭제 전 백업은 Firestore trash 에 90일 보관).
# 수동 실행 시 dry_run=true 로 대상만 확인할 수 있습니다.
name: 오래 안 쓴 팀 정리
on:
  schedule:
    - cron: '17 18 1 * *'   # 매달 1일 03:17 (한국 시간)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = 대상만 확인 (삭제 안 함)'
        default: 'true'
        required: true
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 서비스 계정 키 준비
        run: printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
      - name: 실행
        run: |
          npm i --no-save firebase-admin@12
          node tools/cleanup-stale-teams.mjs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
